<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="SECBL">
  <!--
    Brand mark: a racked triangle in the club palette (felt green #03600c,
    gold #ffde59, white, black). The wordmark's ball-grid letterforms turn to
    mush below ~40px, so the icon carries the ball motif instead of the letters.
    The faint white stroke keeps the black balls legible against the felt.
  -->
  <rect width="100" height="100" rx="22" fill="#03600c"/>
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
    <circle cx="50" cy="31" r="9.5" fill="#ffde59"/>
    <circle cx="39" cy="49.5" r="9.5" fill="#ffffff"/>
    <circle cx="61" cy="49.5" r="9.5" fill="#111111"/>
    <circle cx="28" cy="68" r="9.5" fill="#111111"/>
    <circle cx="50" cy="68" r="9.5" fill="#ffde59"/>
    <circle cx="72" cy="68" r="9.5" fill="#ffffff"/>
  </g>
</svg>
