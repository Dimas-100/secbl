<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option E — Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#C9A96E}a:hover{color:#E0C590}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#6F7278}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; color: #F2F1EE; font-family: 'Geist', system-ui, sans-serif; font-feature-settings: 'tnum' 1">

  <div style="height: 100%; overflow-y: auto; padding: 60px 24px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

    <header style="display: flex; align-items: center; justify-content: space-between">
      <a href="OptE_Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F2F1EE; text-decoration: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em">Messages</h1>
      <button aria-label="New message" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F2F1EE; color: #0E0F11; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      </button>
    </header>

    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; background: #16181B; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E9196" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="text" aria-label="Search messages" placeholder="Search people and groups" style="flex: 1; background: transparent; border: 0; outline: none; color: #F2F1EE; font-size: 15px; font-family: inherit">
    </div>

    <div role="tablist" aria-label="Chat filter" style="display: flex; gap: 24px; border-bottom: 1px solid rgba(255,255,255,.08)">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <ul style="list-style: none; margin: -8px 0 0; padding: 0">
      <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
        <li style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06)">
          <span style="position: relative; width: 48px; height: 48px; flex: none; border-radius: {{c.radius}}; background: {{c.tone}}; box-shadow: 0 0 0 1px rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #DCD8CF">{{c.av}}
            <sc-if value="{{c.hasDot}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 6px; background: {{c.dot}}; box-shadow: 0 0 0 3px #0E0F11"></span>
            </sc-if>
          </span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
              <span style="font-size: 15px; font-weight: {{c.nameWeight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
              <span style="font-size: 12px; color: {{c.timeColor}}; flex: none">{{c.time}}</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
              <span style="font-size: 13px; color: {{c.previewColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span>
              <sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{false}}">
                <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #C9A96E; color: #0E0F11; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none">{{c.unread}}</span>
              </sc-if>
            </div>
          </div>
        </li>
      </sc-for>
    </ul>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (this.state && this.state.filter) || 'All';
    const tab = (on) => 'height: 44px; padding: 0; border: 0; background: transparent; font-size: 15px; margin-bottom: -1px; ' +
      (on ? 'color: #F2F1EE; font-weight: 500; border-bottom: 1px solid #F2F1EE;' : 'color: #7D8086; font-weight: 400; border-bottom: 1px solid transparent;');
    const round = '24px', square = '14px';
    const all = [
      { kind: 'Direct', name: 'Kevin Moss', av: 'KM', tone: '#2B3140', radius: round, preview: 'Confirmed 5–3. Rematch Thursday?', time: '9:14 PM', unread: 1 },
      { kind: 'Schools', name: 'Georgia State Billiards', av: 'GSU', tone: '#1D2A4A', radius: square, dot: '#4C7DFF', preview: 'TJ: tables 3–6 reserved for Thursday', time: '8:02 PM', unread: 2 },
      { kind: 'Events', name: 'League night · GSU vs GT', av: 'LN', tone: '#2A3A33', radius: square, preview: 'Lineup posted, see pinned message', time: '6:45 PM', unread: 0 },
      { kind: 'Schools', name: 'SEC Billiards', av: 'SEC', tone: '#3A3328', radius: square, preview: 'Invitational registration closes Nov 8', time: 'Mon', unread: 0 },
      { kind: 'Direct', name: 'Lena Kim', av: 'LK', tone: '#3A3328', radius: round, preview: 'You: Good game, that last rack was rough', time: 'Sun', unread: 0 },
      { kind: 'Events', name: 'Break and position clinic', av: 'CL', tone: '#33293A', radius: square, preview: 'Bring your own cue if you have one', time: 'Sat', unread: 0 }
    ];
    return {
      filters: ['All', 'Direct', 'Schools', 'Events'].map((label) => ({
        label, on: f === label, style: tab(f === label), pick: () => this.setState({ filter: label })
      })),
      chats: all.filter((c) => f === 'All' || c.kind === f).map((c) => {
        const u = c.unread > 0;
        return {
          ...c, hasUnread: u, hasDot: !!c.dot,
          nameWeight: u ? 600 : 500, previewColor: u ? '#D6D4CE' : '#8E9196', timeColor: u ? '#C9A96E' : '#8E9196'
        };
      })
    };
  }
}
</script>
</body>
</html>
