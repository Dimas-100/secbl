<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option E — Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#C9A96E}a:hover{color:#E0C590}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;width:60px;min-height:44px;color:#7D8086;text-decoration:none;font-size:10px;font-weight:500;letter-spacing:.04em}
.tab:hover{color:#F2F1EE}
.tab.on{color:#F2F1EE}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; color: #F2F1EE; font-family: 'Geist', system-ui, sans-serif; font-feature-settings: 'tnum' 1">

  <div style="height: 100%; overflow-y: auto; padding: 60px 24px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">

    <header style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; color: #F2F1EE">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      </button>
      <a href="OptE_Chats.dc.html" aria-label="Messages, 3 unread" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F2F1EE; text-decoration: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
        <span style="position: absolute; top: 10px; right: 10px; width: 7px; height: 7px; border-radius: 4px; background: #C9A96E; box-shadow: 0 0 0 2px #0E0F11"></span>
      </a>
    </header>

    <section style="display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: -24px">
      <div style="position: relative; width: 128px; height: 128px">
        <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{true}}">
          <span role="img" aria-label="Profile photo" style="width: 128px; height: 128px; border-radius: 64px; background: #2B3A33; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 0 0 6px #0E0F11, 0 0 0 7px rgba(201,169,110,.55); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 500; letter-spacing: -.02em; color: #DCD8CF">DD</span>
        </sc-if>
        <sc-if value="{{noPhoto}}" hint-placeholder-val="{{false}}">
          <button aria-label="Add a profile photo" style="width: 128px; height: 128px; border-radius: 64px; border: 1px dashed rgba(255,255,255,.28); background: #16181B; color: #8E9196; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
            Add photo
          </button>
        </sc-if>
        <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{true}}">
          <button aria-label="Change profile photo" style="position: absolute; right: 2px; bottom: 2px; width: 38px; height: 38px; border-radius: 19px; border: 0; background: #F2F1EE; color: #0E0F11; box-shadow: 0 0 0 4px #0E0F11; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          </button>
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -.025em">Dimas Diaz</h1>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8E9196">@dimas_d <span style="width: 3px; height: 3px; border-radius: 2px; background: #5A5D63"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #4C7DFF"></span>Georgia State</span>
      </div>
      <div style="display: flex; gap: 10px">
        <button style="height: 40px; padding: 0 20px; border-radius: 20px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); color: #F2F1EE; font-size: 14px; font-weight: 500">Edit profile</button>
        <button aria-label="Share profile" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); color: #F2F1EE; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"></path></svg>
        </button>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); padding: 18px 0">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="{{s.cell}}">
          <span style="font-size: 20px">{{s.v}}</span>
          <span style="font-size: 11px; color: #8E9196">{{s.l}}</span>
        </div>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -.01em">Level 12 <span style="color: #C9A96E; font-weight: 500">· Shark</span></span>
        <span style="font-size: 12px; color: #8E9196">640 / 1,000 XP</span>
      </div>
      <div style="height: 2px; background: rgba(255,255,255,.08)"><div style="width: 64%; height: 100%; background: #C9A96E"></div></div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em">Match history</h2>
        <span style="font-size: 13px; color: #C9A96E">Filter</span>
      </div>
      <sc-for list="{{history}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06)">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: {{g.tone}}; box-shadow: 0 0 0 1px rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #DCD8CF">{{g.i}}</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 500">{{g.opp}}</span>
            <span style="font-size: 12px; color: #8E9196">{{g.meta}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
            <span style="font-size: 15px; color: {{g.resColor}}">{{g.res}}</span>
            <span style="font-size: 12px; color: #8E9196">{{g.delta}}</span>
          </div>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: #0E0F11; border-top: 1px solid rgba(255,255,255,.07); display: flex; align-items: flex-start; justify-content: space-around; padding: 12px 10px 0; box-sizing: border-box">
    <a href="OptE_Home.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="OptE_Ranks.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V11M12 20V4M18 20v-6"></path></svg>Ranks</a>
    <a href="OptE_LogGame.dc.html" aria-label="Log a game" style="width: 50px; height: 50px; border-radius: 25px; background: #F2F1EE; color: #0E0F11; display: flex; align-items: center; justify-content: center; margin-top: -6px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="OptE_Events.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events</a>
    <a href="OptE_Profile.dc.html" class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hasPhoto":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hasPhoto = this.props.hasPhoto ?? true;
    const win = '#F2F1EE', loss = '#8E9196';
    const cell = (first) => 'display: flex; flex-direction: column; align-items: center; gap: 4px;' + (first ? '' : ' border-left: 1px solid rgba(255,255,255,.08);');
    return {
      hasPhoto, noPhoto: !hasPhoto,
      stats: [['1,482', 'Rating'], ['#7', 'Rank'], ['24–15', 'Record'], ['6', 'Best streak']].map(([v, l], k) => ({ v, l, cell: cell(k === 0) })),
      history: [
        { i: 'KM', tone: '#2B3140', opp: 'Kevin Moss', meta: 'Georgia Tech · 8-Ball · Oct 5', res: 'Won 5–3', resColor: win, delta: '+16' },
        { i: 'RJ', tone: '#3A2F2A', opp: 'Ray Johnson', meta: 'Georgia · 9-Ball · Oct 4', res: 'Lost 4–7', resColor: loss, delta: '−9' },
        { i: 'MP', tone: '#33293A', opp: 'Mia Patel', meta: 'Florida State · 8-Ball · Oct 3', res: 'Won 5–1', resColor: win, delta: '+17' },
        { i: 'TW', tone: '#2A3A33', opp: 'TJ Walker', meta: 'Georgia State · Unranked · Oct 1', res: 'Won 5–4', resColor: win, delta: '—' }
      ]
    };
  }
}
</script>
</body>
</html>
