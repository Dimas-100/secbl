<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option E — Ranks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#C9A96E}a:hover{color:#E0C590}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;width:60px;min-height:44px;color:#7D8086;text-decoration:none;font-size:10px;font-weight:500;letter-spacing:.04em}
.tab:hover{color:#F2F1EE}
.tab.on{color:#F2F1EE}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; color: #F2F1EE; font-family: 'Geist', system-ui, sans-serif; font-feature-settings: 'tnum' 1">

  <div style="height: 100%; overflow-y: auto; padding: 60px 24px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

    <header style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #8E9196">Fall 2026 · Week 6</span>
        <h1 style="margin: 0; font-size: 32px; font-weight: 600; line-height: 1; letter-spacing: -.03em">Leaderboard</h1>
      </div>
      <a href="OptE_Chats.dc.html" aria-label="Messages, 3 unread" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F2F1EE; text-decoration: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
        <span style="position: absolute; top: 10px; right: 10px; width: 7px; height: 7px; border-radius: 4px; background: #C9A96E; box-shadow: 0 0 0 2px #0E0F11"></span>
      </a>
    </header>

    <div role="tablist" aria-label="Leaderboard type" style="display: flex; gap: 24px; border-bottom: 1px solid rgba(255,255,255,.08)">
      <button role="tab" aria-selected="{{isPlayers}}" onClick="{{showPlayers}}" style="{{pTab}}">Players</button>
      <button role="tab" aria-selected="{{isSchools}}" onClick="{{showSchools}}" style="{{sTab}}">Schools</button>
    </div>

    <sc-if value="{{isPlayers}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 28px">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end">
          <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
              <span style="width: {{p.size}}; height: {{p.size}}; border-radius: 50%; background: {{p.tone}}; box-shadow: 0 0 0 1px {{p.ring}}, 0 0 0 5px #0E0F11, 0 0 0 6px {{p.ring}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; color: #DCD8CF">{{p.i}}</span>
              <span style="font-size: 13px; font-weight: 600; letter-spacing: .06em; line-height: 1; color: {{p.ring}}">#{{p.rank}}</span>
              <span style="display: flex; flex-direction: column; align-items: center; gap: 2px">
                <span style="font-size: 14px; font-weight: 500">{{p.name}}</span>
                <span style="font-size: 12px; color: #8E9196">{{p.rating}}</span>
              </span>
            </div>
          </sc-for>
        </div>

        <ol aria-label="Players ranked 4 to 10" style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
            <li style="{{r.rowStyle}}">
              <span style="width: 22px; font-size: 13px; color: #8E9196">{{r.rank}}</span>
              <span style="width: 38px; height: 38px; border-radius: 19px; background: {{r.tone}}; box-shadow: 0 0 0 1px rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #DCD8CF">{{r.i}}</span>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 15px; font-weight: 500">{{r.name}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8E9196"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{r.dot}}"></span>{{r.school}}</span>
              </div>
              <span style="font-size: 15px">{{r.rating}}</span>
            </li>
          </sc-for>
        </ol>
      </div>
    </sc-if>

    <sc-if value="{{isSchools}}" hint-placeholder-val="{{false}}">
      <ol aria-label="School standings" style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{schools}}" as="s" hint-placeholder-count="5">
          <li style="{{s.rowStyle}}">
            <span style="width: 34px; font-size: 22px; font-weight: 500; line-height: 1.1; color: {{s.rankColor}}">{{s.rank}}</span>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between; align-items: baseline">
                <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}"></span>{{s.name}}</span>
                <span style="font-size: 15px">{{s.pts}}</span>
              </div>
              <div style="height: 2px; background: rgba(255,255,255,.08)"><div style="height: 100%; width: {{s.bar}}; background: {{s.barColor}}"></div></div>
              <span style="font-size: 12px; color: #8E9196">{{s.members}} players · {{s.record}}</span>
            </div>
          </li>
        </sc-for>
      </ol>
    </sc-if>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: #0E0F11; border-top: 1px solid rgba(255,255,255,.07); display: flex; align-items: flex-start; justify-content: space-around; padding: 12px 10px 0; box-sizing: border-box">
    <a href="OptE_Home.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="OptE_Ranks.dc.html" class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V11M12 20V4M18 20v-6"></path></svg>Ranks</a>
    <a href="OptE_LogGame.dc.html" aria-label="Log a game" style="width: 50px; height: 50px; border-radius: 25px; background: #F2F1EE; color: #0E0F11; display: flex; align-items: center; justify-content: center; margin-top: -6px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="OptE_Events.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events</a>
    <a href="OptE_Profile.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const view = (this.state && this.state.view) || 'players';
    const isPlayers = view === 'players';
    const tab = (on) => 'height: 44px; padding: 0; border: 0; background: transparent; font-size: 15px; margin-bottom: -1px; ' +
      (on ? 'color: #F2F1EE; font-weight: 500; border-bottom: 1px solid #F2F1EE;' : 'color: #7D8086; font-weight: 400; border-bottom: 1px solid transparent;');
    const D = { 'Georgia State': '#4C7DFF', 'Georgia': '#E04A60', 'Georgia Tech': '#C9B77A', 'Florida State': '#B0586C', 'Kennesaw State': '#F2C14E' };
    const tones = ['#2B3140', '#3A2F2A', '#33293A', '#2A3A33', '#3A3328'];
    const row = 'display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06);';
    const list = [
      [4, 'Lena Kim', 'Kennesaw State', '1,598'], [5, 'TJ Walker', 'Georgia State', '1,571'],
      [6, 'Noah Reed', 'Georgia', '1,520'], [7, 'Dimas Diaz', 'Georgia State', '1,482'],
      [8, 'Carlos Ortiz', 'Georgia Tech', '1,470'], [9, 'Mia Patel', 'Florida State', '1,455'],
      [10, 'Andre Brooks', 'Kennesaw State', '1,441']
    ];
    return {
      isPlayers, isSchools: !isPlayers, pTab: tab(isPlayers), sTab: tab(!isPlayers),
      showPlayers: () => this.setState({ view: 'players' }),
      showSchools: () => this.setState({ view: 'schools' }),
      podium: [
        { rank: '2', i: 'KM', name: 'Kevin Moss', rating: '1,664', tone: '#2B3140', ring: '#B8BEC6', size: '64px' },
        { rank: '1', i: 'RJ', name: 'Ray Johnson', rating: '1,711', tone: '#3A2F2A', ring: '#C9A96E', size: '80px' },
        { rank: '3', i: 'BB', name: 'Bree Banks', rating: '1,630', tone: '#33293A', ring: '#B08566', size: '64px' }
      ],
      rows: list.map(([rank, name, school, rating], k) => ({
        rank, name, school, rating, dot: D[school], tone: tones[k % tones.length],
        i: name.split(' ').map((w) => w[0]).join(''),
        rowStyle: name === 'Dimas Diaz'
          ? row + ' margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 14px; background: #16181B; border-bottom-color: transparent;'
          : row
      })),
      schools: [
        ['Georgia', 2340, 34, '48–31', '100%'], ['Georgia State', 2215, 29, '44–33', '95%'],
        ['Georgia Tech', 2190, 31, '45–36', '94%'], ['Florida State', 1960, 22, '37–35', '84%'],
        ['Kennesaw State', 1875, 25, '35–38', '80%']
      ].map(([name, pts, members, record, bar], k) => ({
        rank: k + 1, name, members, record, bar, pts: pts.toLocaleString('en-US'), dot: D[name],
        rankColor: k === 0 ? '#C9A96E' : '#8E9196',
        barColor: name === 'Georgia State' ? '#C9A96E' : 'rgba(255,255,255,.35)',
        rowStyle: 'display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,.06);'
      }))
    };
  }
}
</script>
</body>
</html>
